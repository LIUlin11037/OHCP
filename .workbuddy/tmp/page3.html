    function logoOnError(that) {
        var errorCount = $(that).attr("errorCount");
        if (errorCount == undefined) {
            errorCount = 1;
        }
        if (eval(errorCount) > 1) {
            return;
        } else {
            var isSquare = true;// 为了使用大图标
            utils.newSetlogo([fileinfo], null, isSquare, false);
            let logo = fileinfo.logo;
            if (logo != "" && logo != null) {
                $(that).attr("src", logo)
            } else {
                $(that).attr("src", "/" + visitPrefix + "views/images/filelogo/x_def.png")
            }
            $(that).attr("errorCount", errorCount + 1);
        }
    }

    const isMacOS = () => {
        return /Macintosh/.test(navigator.userAgent) && !/(iPhone|iPad|iPod)/.test(navigator.userAgent);
    };

    function isWeixin() {
        var ua = navigator.userAgent.toLowerCase();
        var isWeixin = ua.indexOf('micromessenger') != -1;
        if (isWeixin) {
            return true;
        } else {
            return false;
        }

    function selectCoverstatus() {
